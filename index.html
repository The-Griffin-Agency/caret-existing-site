<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CARET | Product Review</title>
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<header>
<div class="bar">
<nav aria-label="Review pages">
<a href="#homepage" data-page="homepage">Homepage</a>
<a href="#hub" data-page="hub" aria-current="page">Hub</a>
<a href="#capture" data-page="capture">Capture</a>
<a href="#command" data-page="command">Command</a>
<a href="#court-rules" data-page="court-rules">Court Rules</a>
<a href="#caret-why" data-page="caret-why">CARET Why</a>
<a class="docs" href="https://drive.google.com/drive/folders/1Wsq7YRHeNqYgl7ijGi8k7lE2Oz61lulN?usp=sharing" target="_blank" rel="noopener noreferrer">Copy Docs ↗</a>
</nav>
<div class="controls" role="group" aria-label="Image size">
<button type="button" id="fit" aria-pressed="true">Fit width</button>
<button type="button" id="actual" aria-pressed="false">Actual size</button>
</div>
</div>
</header>
<main id="canvas" aria-label="Page mockup">
<img id="mockup" alt="Hub page design" width="1600" height="5770">
<p id="error" role="alert" hidden>Image could not load. Please reload the page.</p>
<noscript><p>Please enable JavaScript to browse the review pages.</p><img src="images/261107_CARET_Product_Hub_v2.png" alt="Hub page design" style="width:100%;height:auto"></noscript>
</main>
<script>
// Keep index.html at the same URL. Update this map for each new image filename.
const pages = {
  'homepage': { label: 'Homepage', file: 'homepage-v1a.png', height: 6500 },
  'hub': { label: 'Hub', file: '261107_CARET_Product_Hub_v2.png', height: 5770 },
  'capture': { label: 'Capture', file: '261107_product_capture_v1.png', height: 6000 },
  'command': { label: 'Command', file: '261107_product_command_v1.png', height: 5770 },
  'court-rules': { label: 'Court Rules', file: '261107_product_court-rules_v1b.png', height: 6000 },
  'caret-why': { label: 'CARET Why', file: '261107_CARET_Why_v2.png', height: 6300 }
};
// Increment this when replacing images without changing their filenames.
const IMAGE_VERSION = "20261109-2";
const canvas = document.getElementById('canvas');
const mockup = document.getElementById('mockup');
const error = document.getElementById('error');
function showPage() {
  const key = Object.hasOwn(pages, location.hash.slice(1)) ? location.hash.slice(1) : 'hub';
  const page = pages[key];
  error.hidden = true;
  mockup.hidden = false;
  mockup.alt = page.label + ' page design';
  mockup.height = page.height;
  mockup.src = 'images/' + page.file + '?v=' + IMAGE_VERSION;
  document.title = page.label + ' | CARET Product Review';
  document.querySelectorAll('[data-page]').forEach(link => {
    if (link.dataset.page === key) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  canvas.scrollLeft = 0;
}
mockup.addEventListener('error', () => { mockup.hidden = true; error.hidden = false; });
function setSize(actual) {
  canvas.classList.toggle('actual', actual);
  document.getElementById('fit').setAttribute('aria-pressed', String(!actual));
  document.getElementById('actual').setAttribute('aria-pressed', String(actual));
}
document.getElementById('fit').addEventListener('click', () => setSize(false));
document.getElementById('actual').addEventListener('click', () => setSize(true));
window.addEventListener('hashchange', showPage);
showPage();
</script>
</body>
</html>
